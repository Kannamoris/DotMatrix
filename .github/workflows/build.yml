name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed to publish releases.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every build on main becomes a release, so the version has to advance on
  # its own for a sideloader to notice there is something new.
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build (iOS, unsigned)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # The project uses file-system-synchronized groups
          # (objectVersion 77), which need Xcode 16 or later.
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          # Unsigned: CI has no certificate. Feather signs on-device.
          xcodebuild build \
            -project DotMatrix.xcodeproj \
            -scheme DotMatrix \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee build.log

      - name: Summarize diagnostics
        if: always()
        run: |
          {
            echo "## Build diagnostics"
            echo

            errors=$(grep -E '^[^ ].*:[0-9]+:[0-9]+: error:' build.log | sort -u || true)
            warnings=$(grep -E '^[^ ].*:[0-9]+:[0-9]+: warning:' build.log | sort -u || true)

            count_e=$(printf '%s' "$errors" | grep -c . || true)
            count_w=$(printf '%s' "$warnings" | grep -c . || true)

            echo "**${count_e} errors, ${count_w} warnings**"
            echo

            if [ "$count_e" -gt 0 ]; then
              echo "### Errors"
              echo '```'
              printf '%s\n' "$errors" | sed "s|$GITHUB_WORKSPACE/||" | head -100
              echo '```'
              echo
              echo "### Errors by file"
              echo '```'
              printf '%s\n' "$errors" \
                | sed "s|$GITHUB_WORKSPACE/||" \
                | cut -d: -f1 | sort | uniq -c | sort -rn
              echo '```'
            fi

            if [ "$count_w" -gt 0 ]; then
              echo "<details><summary>Warnings (${count_w})</summary>"
              echo
              echo '```'
              printf '%s\n' "$warnings" | sed "s|$GITHUB_WORKSPACE/||" | head -60
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Package unsigned IPA
        if: success()
        run: |
          app="build/Build/Products/Release-iphoneos/DotMatrix.app"
          if [ ! -d "$app" ]; then
            echo "No .app produced at $app" >&2
            exit 1
          fi
          # An IPA is a zip with the bundle under Payload/.
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry DotMatrix.ipa Payload
          ls -lh DotMatrix.ipa

      - name: Generate sideload source manifest
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import json, os, datetime, subprocess

          version = os.environ["APP_VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          size = os.path.getsize("DotMatrix.ipa")
          tag = f"v{version}"
          download = f"https://github.com/{repo}/releases/download/{tag}/DotMatrix.ipa"

          # Subject of the commit that triggered this build, as the changelog.
          try:
              subject = subprocess.check_output(
                  ["git", "log", "-1", "--format=%s"], text=True
              ).strip()
          except Exception:
              subject = "Latest build."

          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          description = (
              "A Game Boy Advance emulator written in Swift.\n\n"
              "Contains no game data and no BIOS. You supply your own "
              "cartridge image, imported through the Files app or the "
              "document picker."
          )

          app = {
              "name": "DotMatrix",
              "bundleIdentifier": "com.dotmatrix.app",
              "developerName": "Kannamoris",
              "subtitle": "Game Boy Advance emulator",
              "localizedDescription": description,
              "iconURL": "",
              "tintColor": "4AB866",
              "screenshotURLs": [],
              # Legacy single-version fields, for older clients.
              "version": version,
              "versionDate": date,
              "versionDescription": subject,
              "downloadURL": download,
              "size": size,
              # Modern clients read this array instead.
              "versions": [
                  {
                      "version": version,
                      "date": date,
                      "localizedDescription": subject,
                      "downloadURL": download,
                      "size": size,
                      "minOSVersion": "17.0",
                  }
              ],
          }

          source = {
              "name": "DotMatrix",
              "identifier": "com.dotmatrix.source",
              "subtitle": "Game Boy Advance emulator",
              "description": description,
              "iconURL": "",
              "tintColor": "4AB866",
              "apps": [app],
              "news": [],
          }

          with open("source.json", "w") as handle:
              json.dump(source, handle, indent=2)
          print(json.dumps(source, indent=2)[:600])
          PY

      - name: Publish release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${APP_VERSION}"
          notes="$(git log -1 --format='%s%n%n%b')"

          # Assets are attached in one call so the release is never briefly
          # published without the IPA a sideloader is about to fetch.
          gh release create "$tag" \
            DotMatrix.ipa \
            source.json \
            --title "$tag" \
            --notes "$notes" \
            --target "$GITHUB_SHA"

          echo "### Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$tag\` — [release page](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Feather source URL:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/source.json" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DotMatrix-unsigned-ipa
          path: DotMatrix.ipa
          retention-days: 30
